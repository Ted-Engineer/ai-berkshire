name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m py_compile tools/*.py scripts/*.py tests/*.py

      - name: Bash syntax check
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify skill mirrors are in sync
        run: |
          python scripts/sync-codex-skills.py --check
          python scripts/sync-codex-prompts.py --check
          python scripts/sync-trae-skills.py --check
          python scripts/sync-dsh-skills.py --check
          python scripts/sync-zcode-skills.py --check
          python scripts/sync-qoder-skills.py --check
